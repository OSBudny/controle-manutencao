<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Controle da Manutenção</title>

<style>

body {
    margin: 0;
    background: #202124;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 700px;
    margin: 80px auto;
    padding: 30px;
}

h1 {
    color: #f57c00;
}

.card {
    background: #2d2f31;
    padding: 25px;
    border-radius: 12px;
    margin-top: 25px;
}

.status {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    background: #3a3c3f;
}

.ok {
    color: #2ecc71;
}

.erro {
    color: #e74c3c;
}

</style>

</head>


<body>

<div class="container">

<h1>🟠 CONTROLE DA MANUTENÇÃO</h1>

<div class="card">

<h2>Conexão com o banco de dados</h2>

<div
    id="status"
    class="status">

    Testando conexão...

</div>

</div>

</div>


<script type="module">

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/*
==================================================
CONFIGURAÇÃO DO SUPABASE
==================================================
*/


const SUPABASE_URL =
"https://qwaibjzdpwebddvbfkoj.supabase.co";

const SUPABASE_KEY =
"SUA_CHAVE_AQUI";



const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/*
==================================================
TESTAR CONEXÃO
==================================================
*/


async function testarConexao() {

    const status =
        document.getElementById(
            "status"
        );


    const {
        data,
        error
    } =
        await supabase
            .from("funcionarios")
            .select("id")
            .limit(1);


    if(error) {

        status.innerHTML =
            "❌ Erro na conexão:<br><br>" +
            error.message;

        status.className =
            "status erro";

        console.error(error);

        return;

    }


    status.innerHTML =
        "✓ Conexão funcionando!<br><br>" +
        "O sistema já consegue acessar o banco de dados.";

    status.className =
        "status ok";

}


testarConexao();

</script>

</body>

</html>
